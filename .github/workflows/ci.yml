name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', 'lts/*']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/deps/*.test.mjs
      - run: node --test test/brief/*.test.mjs

  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict ./plugins/deps
      - run: claude plugin validate --strict ./plugins/brief
      - run: claude plugin validate --strict ./plugins/git
      - run: claude plugin validate --strict ./plugins/workflow
