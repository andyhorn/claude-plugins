name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # release-please builds changelogs and version bumps from squash-merge
      # commits, which take the PR title.
      - name: Check PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits: type(scope)?: description"
            echo "Got: $PR_TITLE"
            echo "Types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
