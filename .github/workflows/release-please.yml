name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLIENT_ID: op://claude-plugins/release-please/client_id
          PRIVATE_KEY: op://claude-plugins/release-please/claude-plugins-release-please.private-key.pem
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.secrets.outputs.CLIENT_ID }}
          private-key: ${{ steps.secrets.outputs.PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
